# PACT Configuration
# This file configures how PACT contracts are generated and where they are stored

# Consumer name - identifies this service as a consumer
pact.consumer.name=sap-pair-project-client

# Provider name - identifies the service we're testing against
pact.provider.name=sap-pair-project

# Directory where PACT files will be generated
pact.pacts.directory=target/pacts

# Write pact files in JSON format (default)
pact.pacts.write.mode=merge

# Enable PACT specification version 3 (supports more advanced features)
pact.specification.version=V3

# PACT Broker configuration (if using a PACT Broker)
pactbroker.host=localhost
pactbroker.port=9292
pactbroker.protocol=http

# Tags for versioning contracts
pact.consumer.version=${project.version}
pact.tag=main
